### model
model_name_or_path: Qwen/Qwen2-7B-Instruct
new_special_tokens: <design_start>,<design_end>,<design_body>,<molecule>,<retro_start>,<retro_end>,<retro_body>,<rollback_start>,<rollback_end>
graph_decoder_path: /root/Llamole-main/saves/graph_decoder
graph_encoder_path: /root/Llamole-main/saves/graph_encoder
graph_predictor_path: /root/Llamole-main/saves/graph_predictor
adapter_name_or_path: /root/Llamole-main/saves/Llamole-Qwen2-7B-Instruct-Adapter
graph_lm_connector_path: /root/Llamole-main/saves/Llamole-Qwen2-7B-Instruct-Adapter/connector

### generation
max_length: 1024
max_new_tokens: 256
temperature: 0.7
top_p: 0.9

### method
finetuning_type: lora
do_train: false
flash_attn: disabled
learned_query_size: 8

### dataset
dataset: gbm_custom
template: qwen
cutoff_len: 512
overwrite_cache: true
preprocessing_num_workers: 16
output_dir: gbm_project/experiments/outputs
bf16: true
pure_bf16: true

### eval
per_device_eval_batch_size: 4
report_to: 'none'

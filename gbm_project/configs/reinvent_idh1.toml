# REINVENT4 靶点条件化强化学习 —— IDH1
#
# 用真实 AutoDock Vina 对接分数作为奖励信号（自定义 VinaScore 组件），
# 加上 QED / MW / 结构警示过滤，对模型做 DAP 策略梯度微调，
# 使其生成与 IDH1 口袋匹配的分子。
#
# 这是最严格的第三方基线形式：专用化学语言模型 + 物理对接奖励 +
# 多样性过滤（IdenticalMurckoScaffold）。

run_type = "staged_learning"
device = "cpu"
tb_logdir = "/root/Llamole-main/gbm_project/experiments/reinvent_baseline/tb_IDH1"

[parameters]
prior_file = "/root/reinvent_pubchem.prior"
agent_file = "/root/reinvent_pubchem.prior"
summary_csv_prefix = "/root/Llamole-main/gbm_project/experiments/reinvent_baseline/IDH1_rl"
batch_size = 32
randomize_smiles = true
unique_sequences = true

[learning_strategy]
type = "dap"
sigma = 128
rate = 0.0005

[diversity_filter]
type = "IdenticalMurckoScaffold"
bucket_size = 10
minscore = 0.4

[[stage]]
chkpt_file = "/root/Llamole-main/gbm_project/experiments/reinvent_baseline/IDH1_stage1.chkpt"
termination = "simple"
max_score = 0.9
min_steps = 8
max_steps = 40

[stage.scoring]
type = "geometric_mean"

[[stage.scoring.component]]
[stage.scoring.component.VinaScore]
params.receptor_pdbqt = "/root/Llamole-main/gbm_project/data/receptors/IDH1_IDH2_6U4J_chainA.pdbqt"
params.center = [11.89, -3.71, 23.56]
params.size = [24.0, 24.0, 24.0]
params.exhaustiveness = 4
params.cpu = 4
params.n_workers = 16

[[stage.scoring.component.VinaScore.endpoint]]
name = "Vina"
weight = 1.0

[[stage.scoring.component]]
[stage.scoring.component.QED]
[[stage.scoring.component.QED.endpoint]]
name = "QED"
weight = 0.3

[[stage.scoring.component]]
[stage.scoring.component.MolecularWeight]
[[stage.scoring.component.MolecularWeight.endpoint]]
name = "MW"
weight = 0.2
transform.type = "double_sigmoid"
transform.low = 200.0
transform.high = 500.0

[[stage.scoring.component]]
[stage.scoring.component.custom_alerts]
[[stage.scoring.component.custom_alerts.endpoint]]
name = "Alerts"
params.smarts = [
  "[*;r{8-17}]",
  "[#8][#8]",
  "[#6;+]",
  "[#16][#16]",
  "[#7;!n][S;!$(S(=O)=O)]",
  "[#7;!n][#7;!n]",
  "C#C",
  "C(=[O,S])[O,S]"
]

### model
model_name_or_path: models/Qwen2.5-3B-Instruct
new_special_tokens: <design_start>,<design_end>,<design_body>,<molecule>,<retro_start>,<retro_end>,<retro_body>,<rollback_start>,<rollback_end>
graph_decoder_path: saves/graph_decoder
graph_encoder_path: saves/graph_encoder
graph_predictor_path: saves/graph_predictor
adapter_name_or_path: saves/Qwen2.5-3B-Instruct-Drug-Adapter
graph_lm_connector_path: saves/Qwen2.5-3B-Instruct-Drug-Adapter/connector
use_fast_tokenizer: false
### generation
max_length: 512
max_new_tokens: 128
temperature: 0.3
top_p: 0.8
### method
finetuning_type: lora
do_train: false
flash_attn: disabled
learned_query_size: 8
attn_implementation: eager
### dataset
dataset: molqa_drug
template: qwen
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 4
output_dir: saves/eval_qwen25_results
bf16: true
pure_bf16: true
### eval
per_device_eval_batch_size: 1
report_to: 'none'

### model
model_name_or_path: models/Qwen2-7B-Instruct
new_special_tokens: <design_start>,<design_end>,<design_body>,<molecule>,<retro_start>,<retro_end>,<retro_body,<rollback_start>,<rollback_end>
graph_decoder_path: saves/graph_decoder
graph_encoder_path: saves/graph_encoder
graph_predictor_path: saves/graph_predictor
graph_lm_connector_path: null #specify when resume
### method
stage: mmsft
do_train: true
finetuning_type: lora
lora_target: all
flash_attn: disabled
learned_query_size: 8
### dataset
dataset: molqa_drug
template: qwen
cutoff_len: 128  # 极短序列长度，确保内存安全
overwrite_cache: true
preprocessing_num_workers: 2  # 最小化worker数量
### output
output_dir: saves/Qwen2-7B-Instruct-Drug-Adapter-Final
logging_steps: 1  # 每步都记录，方便监控
save_steps: 100  # 更频繁保存
plot_loss: true
overwrite_output_dir: true
### to resume
# overwrite_output_dir: false
### train
per_device_train_batch_size: 1  # 单样本批次
gradient_accumulation_steps: 8  # 梯度累积8，有效批次8
learning_rate: 1.0e-4
num_train_epochs: 1.0  # 先训练1个epoch测试
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
pure_bf16: true
loss_weight_retro: 1
loss_weight_design: 1
loss_weight_lm: 1
### eval
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 100
### specify if connected to wandb
report_to: 'none'

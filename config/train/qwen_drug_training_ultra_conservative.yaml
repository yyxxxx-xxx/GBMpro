### model
model_name_or_path: models/Qwen2-7B-Instruct
new_special_tokens: <design_start>,<design_end>,<design_body>,<molecule>,<retro_start>,<retro_end>,<retro_body>,<rollback_start>,<rollback_end>
# Non-quantized + conservative memory settings for stability
low_cpu_mem_usage: true
graph_decoder_path: saves/graph_decoder
graph_encoder_path: saves/graph_encoder
graph_predictor_path: saves/graph_predictor
graph_lm_connector_path: null #specify when resume
### method
stage: mmsft
do_train: true
finetuning_type: lora
lora_target: all
flash_attn: disabled
learned_query_size: 8
### dataset
dataset: molqa_drug
template: qwen
cutoff_len: 64  # 极度保守：最小化序列长度到64
overwrite_cache: true
preprocessing_num_workers: 1  # 极度保守：单进程预处理
### output
output_dir: saves/Qwen2-7B-Instruct-Drug-Adapter-UltraConservative
logging_steps: 5  # 更频繁的日志监控
save_steps: 100  # 更频繁的保存
plot_loss: true
overwrite_output_dir: true
### to resume
# overwrite_output_dir: false
### train
per_device_train_batch_size: 1  # 极度保守：每GPU单样本批次
gradient_accumulation_steps: 32  # 梯度累积32，有效批次大小32
learning_rate: 1.0e-5  # 进一步降低学习率
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
ddp_timeout: 180000000
bf16: true
pure_bf16: true
loss_weight_retro: 1
loss_weight_design: 1
loss_weight_lm: 1
# 内存优化 - 超保守设置
ddp_find_unused_parameters: false
### eval
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 100
### specify if connected to wandb
report_to: 'none'
